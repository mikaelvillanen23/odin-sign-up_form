<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Odin Sign-up Form project</title>
</head>
<body>
  <div class="sidebar">
    <div class="odin-container">
      <img src="./assets/odin-lined.png" alt="Odin's beautiful face">
      <h1>ODIN</h1>
    </div>
  </div>
    
  <form action="" method="post">
    <div class="top-wrap">
      <h2>Check out those chia seeds sprouting! How cool is that?!</h2>
      <h2>So cool. <em>Sign up</em> for more!</h2>
    </div>
    <section>
      <h2>Join now!</h2>
      <p><em>Fields market with <span>*</span> are required.</em></p>
      <div class="control-wrap">

        <div class="form-row">
          <div class="input-wrap">
            <label for="first-name">FIRST NAME <span>*</span></label>
            <input type="text" id="first-name" name="first-name" size="25" autocomplete="given-name" required>
            <span></span>
          </div>
          <div class="input-wrap">
            <label for="last-name">LAST NAME <span>*</span></label>
            <input type="text" id="last-name" name="last-name" size="25" autocomplete="family-name" required>
            <span></span>
          </div>
        </div>
       
        <div class="form-row">
          <div class="input-wrap">
            <label for="email">EMAIL <span>*</span></label>
            <input type="email" id="email" name="email" size="25" required>
            <span></span>
          </div>
          <div class="input-wrap">
            <label for="phone">PHONE NUMBER<span> </span></label> <!-- span is here to make input layout uniform -->
            <input type="tel" id="phone" name="phone" autocomplete="tel-local" size="25" pattern="[0-9]{9,12}">
            <span></span>
          </div>
        </div>

        <div class="form-row">
          <div class="input-wrap">
            <label for="pw">PASSWORD <em>(min. 8 chars) </em><span>*</span></label>
            <input type="password" id="pw" name="pw" minlength="8" size="25" required>
            <span></span>
          </div>
          <div class="input-wrap">
            <label for="pw2">CONFIRM PASSWORD <span>*</span></label>
            <input type="password" id="pw2" name="pw2" minlength="8" size="25" required>
            <span></span>
          </div>
        </div>

      </div>
    </section>
    <div class="bottom-wrap">
      <button type="submit">Create Account</button>
      <p>Already have an account? <a href="">Log in</a></p>
    </div>
  </form>
</body>
</html>
