<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Odin Sign-up Form project</title>
</head>
<body>
  <div class="sidebar">
    <div class="odin-container">
      <img src="./assets/odin-lined.png" alt="Odin's beautiful face">
      <h1>ODIN</h1>
    </div>
  </div>
    
  <form action="" method="post">
    <h2>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Nisi eaque dignissimos natus, repudiandae nobis eum aliquam. Iure est eum laboriosam dolor harum illo itaque voluptatem deserunt, consequuntur, voluptatum in atque!</h2>
    <h2>Some more text</h2>
    <section>
      <h2>Let's do this!</h2>
      <label for="first-name">FIRST NAME</label>
      <input type="text" id="first-name" name="first-name">
      <label for="last-name">LAST NAME</label>
      <input type="text" id="last-name" name="last-name">
      <label for="email">EMAIL</label>
      <input type="email" id="email" name="email">
      <label for="phone">PHONE NUMBER</label>
      <input type="tel" id="phone" name="phone">
      <label for="pw">PASSWORD</label>
      <input type="text" id="pw" name="pw">
      <label for="pw2">CONFIRM PASSWORD</label>
      <input type="text" id="pw2" name="pw2">
    </section>
    <button type="submit">Create Account</button>
    <p>Already have an account? <a href="">Log in</a></p>
  </form>

</body>
</html>
